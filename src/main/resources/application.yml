server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/piccolo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

piccolo:
  jwt:
    secret: PiccoloSecretKey2024ForJWTTokenGenerationAndValidation
    expiration: 86400000  # 24 hours in milliseconds
  upload:
    path: uploads/
    allowed-types: jpg,jpeg,png,gif,webp
